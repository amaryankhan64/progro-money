<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Ring Gradient: Navy to Cyan to Green -->
    <linearGradient id="pgRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002169" />
      <stop offset="35%" stop-color="#04479c" />
      <stop offset="65%" stop-color="#008c58" />
      <stop offset="100%" stop-color="#18b849" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="pgArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007a3d" />
      <stop offset="60%" stop-color="#08a04b" />
      <stop offset="100%" stop-color="#34cb55" />
    </linearGradient>

    <!-- Bar Chart Gradients -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#002b66" />
      <stop offset="100%" stop-color="#006699" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#005b82" />
      <stop offset="100%" stop-color="#009c5a" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00854d" />
      <stop offset="100%" stop-color="#14ba4c" />
    </linearGradient>

    <!-- Letter G Gradient -->
    <linearGradient id="gGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#004b50" />
      <stop offset="40%" stop-color="#008346" />
      <stop offset="100%" stop-color="#0ca848" />
    </linearGradient>
  </defs>

  <!-- Background White Circle -->
  <circle cx="250" cy="250" r="236" fill="#ffffff" />

  <!-- Outer Gradient Border Ring -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="url(#pgRingGrad)" stroke-width="20" />

  <!-- Monogram Group (Shifted slightly upward to balance with typography) -->
  <g id="monogram">
    <!-- Letter P (Navy Blue) -->
    <!-- Top & spine of P -->
    <path d="M 102 110 L 285 110 C 330 110 338 155 338 185 C 338 215 315 238 280 242 L 150 242 L 150 310 L 102 310 Z" fill="#002169" />
    <!-- P Inner counter cutout -->
    <path d="M 150 154 L 270 154 C 288 154 294 165 294 185 C 294 202 284 212 265 212 L 150 212 Z" fill="#ffffff" />

    <!-- Letter G (Green) -->
    <path d="M 395 195 C 385 158 355 142 320 142 L 310 142 C 295 142 270 145 250 158 L 270 188 C 285 180 300 178 318 178 C 342 178 354 190 354 210 L 354 235 L 305 235 L 305 272 L 362 272 C 362 285 348 296 322 296 C 292 296 265 275 260 238 L 225 245 C 235 295 275 325 328 325 C 380 325 405 290 405 252 L 405 195 Z" fill="url(#gGrad)" />

    <!-- 3 Bar Chart Pillars under the P spine -->
    <rect x="156" y="258" width="18" height="52" rx="3" fill="url(#barGrad1)" />
    <rect x="182" y="238" width="20" height="72" rx="3" fill="url(#barGrad2)" />
    <rect x="210" y="220" width="22" height="90" rx="3" fill="url(#barGrad3)" />

    <!-- Dynamic Swoosh with Arrowhead -->
    <!-- Curved Tail -->
    <path d="M 102 310 Q 155 215 285 168 Q 335 150 380 115 L 365 145 Q 315 178 268 198 Q 165 240 102 310 Z" fill="url(#pgArrowGrad)" />
    <!-- Sharp Arrowhead at Top-Right -->
    <polygon points="385,82 322,118 368,135 348,162 385,82" fill="url(#pgArrowGrad)" />
  </g>

  <!-- Brand Typography -->
  <!-- "ProGro" in Deep Navy Bold Sans -->
  <text 
    x="250" 
    y="386" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Cabinet Grotesk', 'Plus Jakarta Sans', sans-serif" 
    font-weight="900" 
    font-size="64" 
    letter-spacing="-1" 
    fill="#002169"
  >
    ProGro
  </text>

  <!-- "— MONEY —" in Vibrant Green with side rules -->
  <g transform="translate(0, 424)">
    <!-- Left Rule -->
    <line x1="105" y1="-8" x2="140" y2="-8" stroke="#08a04b" stroke-width="4.5" stroke-linecap="round" />
    <!-- Text -->
    <text 
      x="250" 
      y="0" 
      text-anchor="middle" 
      font-family="system-ui, -apple-system, 'Cabinet Grotesk', 'Plus Jakarta Sans', sans-serif" 
      font-weight="800" 
      font-size="33" 
      letter-spacing="5" 
      fill="#08a04b"
    >
      MONEY
    </text>
    <!-- Right Rule -->
    <line x1="360" y1="-8" x2="395" y2="-8" stroke="#08a04b" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
